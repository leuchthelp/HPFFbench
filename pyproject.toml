[project]
name = "hpffbench"
version = "0.1.0"
description = "A file format benchmark framework designed for High Performance Compute (HPC) clusters running slurm."
readme = "README.md"
authors = [
    { name = "leucht", email = "lucas.philipp@st.ovgu.de" }
]
requires-python = ">=3.14"
dependencies = [
    "mkdocstrings-python>=2.0.5",
    "pandas>=3.0.3",
    "pathos>=0.3.5",
    "pip>=26.1.2",
    "plotly>=6.8.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.68.3",
    "ty>=0.0.55",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.15.19",
    "zensical>=0.0.46",
]

[tool.uv.workspace]
members = [
    "hpffbench",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

