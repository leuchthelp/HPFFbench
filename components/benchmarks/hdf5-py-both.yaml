parallel: configurable
par_backend: MPI
language: py
extension: h5
format: hdf5
create_command: 
    serial     : python {runnable}
    MPI        : mpiexec -n python {runnable}
    profile    : py-spy record --rate 100 --format speedscope -o <profile_path>.json -- python {runnable}
    profile-MPI: mpiexec -n py-spy record --rate 100 --format speedscope -o <profile_path>.json -- python {runnable}
create: |
    from func import datastruct as ds
    from dev_utils import bcolors as color
    import argparse

    def create_ds(form, parallel=False, path=None, collective=False):

        #new.create(path=path, shape=(512, 512, 512), chunks=(512, 512, 8), mode="r", engine="hdf5")
        ds_hdf5 = ds.Datastruct() 
        print(color.WARNING + f"Creating hdf5" + color.ENDC)
        ds_hdf5.create(path=path, form=form, engine="hdf5", parallel=parallel, collective=collective)
    

    def create(variables=[], shapes=[], chunks=[], datatypes=[], parallel=False, path=None, collective=False):
        form = {}
        for index, var in enumerate(variables):
            form[var] = [shapes[index], chunks[index], datatypes[index]]

        create_ds(form=form, parallel=parallel, path=path, collective=collective)

    #MAIN
run_command:  
    serial     : python {runnable} -v
    MPI        : mpiexec -n python {runnable} -v
    profile    : py-spy record --rate 100 --gil --idle --native --threads --function --subprocesses --format speedscope -o <profile_path>.json -- python {runnable} -v
    profile-MPI: mpiexec -n py-spy record --rate 100 --idle --subprocesses --full-filenames -F -n --format speedscope -o <profile_path>.json -- python {runnable} -v
source: | 
    from func import datastruct as ds
    import argparse

    def bench(iterations, variable: None, parallel=False, path=None, collective=False):

        ds_hdf5 = ds.Datastruct()
        ds_hdf5.open(mode="r", engine="hdf5", path=path, parallel=parallel)

        if parallel:
            ds_hdf5.collective = collective
            ds_hdf5.read("bench_complete_parallel", variable=variable, iterations=iterations)
        else:
            ds_hdf5.read("bench_complete", variable=variable, iterations=iterations)
        result = ds_hdf5.log

        return result
    
    #MAIN

