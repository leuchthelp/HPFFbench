create: |
    #include <stdio.h>
    #include <stdlib.h>
    #include <time.h>
    #include <hdf5.h>
    #include <unistd.h>
    #include <argp.h>

    #define ANSI_COLOR_RED "\x1b[31m"
    #define ANSI_COLOR_GREEN "\x1b[32m"
    #define ANSI_COLOR_YELLOW "\x1b[33m"
    #define ANSI_COLOR_BLUE "\x1b[34m"
    #define ANSI_COLOR_MAGENTA "\x1b[35m"
    #define ANSI_COLOR_CYAN "\x1b[36m"
    #define ANSI_COLOR_RESET "\x1b[0m"

    void create(bool with_chunking, char **variables, hsize_t **shapes, hsize_t **chunks, char **datatypes, char *location)
    {
        printf(ANSI_COLOR_YELLOW "Create hdf5 file" ANSI_COLOR_RESET "\n");
        hid_t plist_id, file_id, filespace, dset_id; /* file identifier */
        herr_t status;
        hsize_t dims[1];
        hsize_t cdims[1];
    
        /* Create a new file using default properties. */
        file_id = H5Fcreate(location, H5F_ACC_TRUNC, H5P_DEFAULT, H5P_DEFAULT);
    
        // setup dimensions
        printf("size of dataset %ld \n", shapes[0][0]);
        hsize_t some_size = shapes[0][0];
    
        dims[0] = some_size;
        filespace = H5Screate_simple(1, dims, NULL);
    
        plist_id = H5Pcreate(H5P_DATASET_CREATE);
    
        if (chunks[0][0] != 0)
        {
            // setup chunking
            printf("chunksize %ld \n", chunks[0][0]);
            cdims[0] = chunks[0][0];
            status = H5Pset_chunk(plist_id, 1, cdims);
        }
    
        // create Dataset
        dset_id = H5Dcreate(file_id, variables[0], H5T_IEEE_F64LE, filespace, H5P_DEFAULT, plist_id, H5P_DEFAULT);
    
        // fill buffer
        float *wbuf = calloc(some_size, sizeof(float));
    
        if (!wbuf)
        {
            fprintf(stderr, "Fatal: unable to allocate shape_arr\n");
            exit(EXIT_FAILURE);
        }
    
        for (hsize_t i = 0; i < some_size; i++)
        {
            wbuf[i] = (float)rand() / RAND_MAX;
        }
    
        status = H5Dwrite(dset_id, H5T_NATIVE_FLOAT, H5S_ALL, H5S_ALL, H5P_DEFAULT, wbuf);
    
        free(wbuf);
    
        /* Terminate access to the file. */
        status = H5Dclose(dset_id);
        status = H5Sclose(filespace);
        status = H5Fclose(file_id);
        printf(ANSI_COLOR_YELLOW "Finish creating hdf5 file" ANSI_COLOR_RESET "\n");
    }

    #MAIN
run_command:
    serial: "{runnable}"
source: |
    #include <stdio.h>
    #include <stdlib.h>
    #include <time.h>
    #include <hdf5.h>
    #include <unistd.h>
    #include <argp.h>

    #define ANSI_COLOR_RED "\x1b[31m"
    #define ANSI_COLOR_GREEN "\x1b[32m"
    #define ANSI_COLOR_YELLOW "\x1b[33m"
    #define ANSI_COLOR_BLUE "\x1b[34m"
    #define ANSI_COLOR_MAGENTA "\x1b[35m"
    #define ANSI_COLOR_CYAN "\x1b[36m"
    #define ANSI_COLOR_RESET "\x1b[0m"

    void bench(hsize_t size, int iteration, char* location)
    {
        double arr3[iteration];

        for (int i = 0; i < iteration; i++)
        {
            printf("i: %d for variable: X\n", i);

            hid_t file_id, dset_id;
            herr_t status;
            hsize_t some_size = size;
            float *rbuf = calloc(some_size, sizeof(float));

            file_id = H5Fopen(location, H5F_ACC_RDONLY, H5P_DEFAULT);
            dset_id = H5Dopen2(file_id, "/X", H5P_DEFAULT);

            struct timespec start, end;

            clock_gettime(CLOCK_MONOTONIC, &start);

            status = H5Dread(dset_id, H5T_NATIVE_FLOAT, H5S_BLOCK, H5S_ALL, H5P_DEFAULT, rbuf);

            status = H5Dclose(dset_id);
            status = H5Fclose(file_id);

            clock_gettime(CLOCK_MONOTONIC, &end);
            double elapsed = end.tv_sec - start.tv_sec;
            elapsed += (end.tv_nsec - start.tv_nsec) / 1000000000.0;
            arr3[i] = elapsed;

            free(rbuf);
            printf(ANSI_COLOR_GREEN "Finished" ANSI_COLOR_RESET "\n");
        }
    }

    #MAIN