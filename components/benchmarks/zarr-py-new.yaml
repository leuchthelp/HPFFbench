run_command:  
    serial  : python {runnable} -v
    MPI: mpiexec -n python {runnable} -v
source: | 
    from func import datastruct as ds
    from func.datastruct import bcolors as color
    import json
    import argparse

    def bench(iterations, variable: None, parallel=False, path=None, collective=False):

        if variable == None:
            variable = []
            with open("run_config.json") as yaml_file:
                tmp = json.load(yaml_file) 

                for keys in tmp.keys():
                  variable.append(keys)

        ds_zarr = ds.Datastruct()
        ds_zarr.open(mode="r", engine="zarr", path=path)

        if parallel:
            ds_zarr.collective = collective
            ds_zarr.read("bench_complete_parallel", variable=variable, iterations=iterations)
        else:
            ds_zarr.read("bench_complete", variable=variable, iterations=iterations)
        result = ds_zarr.log

        #RESULT
    
    #MAIN

