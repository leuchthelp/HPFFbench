    import os
    import shutil
    import json
    from func import datastruct as ds
    from func.datastruct import bcolors as color
    import json
    import argparse

    def create_ds(form, selection, parallel=False):
    
        from mpi4py import MPI
        #new.create(path="test_dataset.zarr", shape=(512, 512, 512), chunks=(512, 512, 8), mode="r+", engine="zarr")
        match selection:
            case 1:
                ds_zarr = ds.Datastruct()
                
                if parallel is False or MPI.COMM_WORLD.rank == 0:
                    if os.path.exists("test_dataset.zarr"):
                        shutil.rmtree("test_dataset.zarr")
                    else:
                        print(f"{color.OKCYAN}The file does not exist{color.ENDC}")
                
                print(f"{color.WARNING}Creating zarr{color.ENDC}")
                ds_zarr.create(path="test_dataset.zarr", form=form, engine="zarr", parallel=parallel)
    

    def create(selection, parallel=False):
        with open("run_config.json") as json_file:
            create_ds(json.load(json_file), selection, parallel=parallel)

    #MAIN
run_command:  "python {path} -b 1 -v {variable}"
source: | 
    import os
    import shutil
    import json
    from func import datastruct as ds
    from func.datastruct import bcolors as color
    import json
    import argparse

    def bench(iterations, variable=None):    
        if variable == None:
            variable = []
            with open("run_config.json") as json_file:
                tmp = json.load(json_file) 

                for keys in tmp.keys():
                  variable.append(keys)

        ds_zarr = ds.Datastruct()
        ds_zarr.open(mode="r+", engine="zarr", path="test_dataset.zarr")
        ds_zarr.read("bench_complete", variable=variable, iterations=iterations)

        with open("test-zarr-python.json", "w") as f:
            json.dump(ds_zarr.log, f)
    
    #MAIN

