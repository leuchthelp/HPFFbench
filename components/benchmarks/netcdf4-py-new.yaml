parallel: configurable
par_backend: MPI
language: py
extension: nc
format: netcdf4
create_command: 
    serial  : python {runnable}
    MPI: mpiexec -n python {runnable}
create: |
    import os
    import shutil
    from func import datastruct as ds
    from func.datastruct import bcolors as color
    import json
    import argparse

    def create_ds(form, selection, parallel=False, path=None):

        if parallel:
            from mpi4py import MPI

        #new.create(path=path, shape=(512, 512, 512), chunks=(512, 512, 8), mode="r+", engine="netcdf4")
        match selection:
            case 1:
                ds_netcdf4 = ds.Datastruct() 
                print(f"{color.WARNING}Creating netcdf4{color.ENDC}")
                ds_netcdf4.create(path=path, form=form, engine="netcdf4", parallel=parallel)
    

    def create(selection, parallel=False, path=None):
        with open("run_config.json") as json_file:
            create_ds(json.load(json_file), selection, parallel=parallel, path=path)

    #MAIN
run_command:  
    serial  : python {runnable} -v
    MPI: mpiexec -n python {runnable} -v
source: | 
    from func import datastruct as ds
    from func.datastruct import bcolors as color
    import json
    import argparse

    def bench(iterations, variable: None, parallel=False, path=None):

        if parallel:
            from mpi4py import MPI

        if variable == None:
            variable = []
            with open("run_config.json") as yaml_file:
                tmp = json.load(yaml_file) 

                for keys in tmp.keys():
                  variable.append(keys)

        ds_netcdf4 = ds.Datastruct()
        ds_netcdf4.open(mode="r+", engine="netcdf4", path=path)

        if parallel:
            ds_netcdf4.read("bench_complete_parallel", variable=variable, iterations=iterations)
        else:
            ds_netcdf4.read("bench_complete", variable=variable, iterations=iterations)
        result = ds_netcdf4.log

        #RESULT
    
    #MAIN

