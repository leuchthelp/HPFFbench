parallel: configurable
par_backend: MPI
language: py
extension: nc
format: netcdf4
create_command: 
    serial  : python {runnable}
    #MPI: mpiexec -n python {runnable}
    profile    : py-spy record --rate 100 --idle --subprocesses --full-filenames -F -n --format speedscope -o <profile_path>.json -- python {runnable}
    #profile-MPI: mpiexec -n py-spy record --full-filenames -F -n --format speedscope -o <profile_path>.json -- python {runnable}
create: |
    from hpffbench.func import datastruct as ds
    from hpffbench.dev_utils import bcolors as color

    def create_ds(form, parallel=False, path=None, collective=False):

        #new.create(path=path, shape=(512, 512, 512), chunks=(512, 512, 8), mode="r", engine="netcdf4")
        ds_netcdf4 = ds.Datastruct() 
        print(color.WARNING + f"Creating netcdf4" + color.ENDC)
        ds_netcdf4.create(path=path, form=form, engine="netcdf4", parallel=parallel, collective=collective)
    

    def create(variables=[], shapes=[], chunks=[], datatypes=[], parallel=False, path=None, collective=False):
        form = {}
        for index, var in enumerate(variables):
            form[var] = [shapes[index], chunks[index], datatypes[index]]

        create_ds(form=form, parallel=parallel, path=path, collective=collective)

    #MAIN
run_command:  
    serial  : python {runnable} -v
    MPI: mpiexec -n python {runnable} -v
    profile    : py-spy record --rate 100 --idle --subprocesses --full-filenames -F -n --format speedscope -o <profile_path>.json -- python {runnable} -v
    profile-MPI: mpiexec -n py-spy record --rate 100 --idle --subprocesses --full-filenames -F -n --format speedscope -o <profile_path>.json -- python {runnable} -v
source: | 
    from hpffbench.func import datastruct as ds


    def bench(iterations, variable: None, parallel=False, path=None, collective=False):

        ds_netcdf4 = ds.Datastruct()
        ds_netcdf4.open(mode="r", engine="netcdf4", path=path, parallel=parallel)


        if parallel:
            ds_netcdf4.collective = collective
            ds_netcdf4.read("bench_complete_parallel", variable=variable, iterations=iterations)
        else:
            ds_netcdf4.read("bench_complete", variable=variable, iterations=iterations)


        result = ds_netcdf4.log

        return result
    
    #MAIN

