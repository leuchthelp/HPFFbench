parallel: False
task: read-random-ND-full-range
language: py
extension: h5
format: hdf5
required_packages:
    - python
    - hdf5
    - h5py
create_command:
  serial: python {runnable}
create: |
  from typing import TypedDict
  
  import h5py
  import numpy as np
  
  
  class Form(TypedDict):
      shape: list[int]
      chunks: list[int]
      dtype: tuple[str, list[str]]
  
  
  class bcolors:
      HEADER = "\033[95m"
      OKBLUE = "\033[94m"
      OKCYAN = "\033[96m"
      OKGREEN = "\033[92m"
      WARNING = "\033[93m"
      FAIL = "\033[91m"
      ENDC = "\033[0m"
      BOLD = "\033[1m"
      UNDERLINE = "\033[4m"
  
  
  def create(
      path: str,
      variables: list[str],
      shapes: list[list[int]],
      chunks: list[list[int]],
      datatypes: list[tuple[str, list[str]]],
      parallel: bool = False,
      collective: bool = False,
  ):
      form: dict[str, Form] = {}
      for index, var in enumerate(variables):
          form[var] = {
              "shape": shapes[index],
              "chunks": chunks[index],
              "dtype": datatypes[index],
          }
  
      root = h5py.File(path, "w-")
      for variable, element in form.items():
          shape = element["shape"]
          chunk = element["chunks"]
          dtype = element["dtype"]
  
          if chunk:
              x: h5py.Dataset = root.create_dataset(
                  variable, shape=shape, chunks=tuple(chunk), dtype=dtype[0]
              )
          else:
              x: h5py.Dataset = root.create_dataset(variable, shape=shape, dtype=dtype[0])
  
          x[:] = np.random.randn(*shape).astype(dtype[0])
  
      root.close()
      print(f"{bcolors.OKGREEN}FINISHED{bcolors.ENDC}")


  #MAIN
run_command:
  serial: python {runnable}
required_additional_params:
    - max_number_access
source: |
  import os
  import time
  from typing import Any
  
  import numpy as np
  import h5py
  
  
  class bcolors:
      HEADER = "\033[95m"
      OKBLUE = "\033[94m"
      OKCYAN = "\033[96m"
      OKGREEN = "\033[92m"
      WARNING = "\033[93m"
      FAIL = "\033[91m"
      ENDC = "\033[0m"
      BOLD = "\033[1m"
      UNDERLINE = "\033[4m"
  
  
  #INSTRUMENTER_START
  def bench_helper(
      iterations: int,
      variables: list[str],
      xrun_params: dict[str, Any],
      node: str,
      dataset: h5py.File,
  ) -> list[tuple[str, ...]]:
      bench: list[tuple[str, ...]] = []
      for _ in range(iterations):
          times: list[float] = []
          total_read: int = 0
  
          for var in variables:
              current: h5py.Dataset = dataset[var]
              combinations = [
                  [
                      slice(None, None, np.random.randint(low=1, high=size))
                      for size in current.shape
                  ]
                  for _ in range(xrun_params["max_number_access"])
              ]
  
              # self.dataset[variable].read_direct(arr)
              start = time.monotonic()
              for comb in combinations:
                  smth = current[*comb]
                  np.mean(smth)
                  total_read += sum(smth.shape)
              times.append(time.monotonic() - start)
  
          bench.append(("0", node, total_read, str(round(np.mean(times), 32))))
  
      dataset.close()
      print(f"{bcolors.OKGREEN}FINISHED{bcolors.ENDC}")
      return bench
  
  
  def bench(
      path: str,
      iterations: int,
      variables: list[str],
      xrun_params: dict[str, Any],
      parallel: bool = False,
      collective: bool = False,
  ) -> list[tuple[str, ...]] | None:
  
      dataset = h5py.File(path, mode="r")
      var_tmp = []
  
      var_sizes: list[tuple[int, ...]] = []
      for var in variables:
          try:
              var_size: tuple[int, ...] = dataset[var].shape
              var_sizes.append(var_size)
              var_tmp.append(var)
          except KeyError:
              print(f"Variable: {var} does not exist.")
      print(f'for variable: {var_tmp} for engine: "hdf5", size: {var_sizes}')
  
      node = "None"
      if "SLURMD_NODENAME" in os.environ:
          node = os.environ["SLURMD_NODENAME"]
  
      result = bench_helper(iterations, var_tmp, xrun_params, node, dataset)
      return result


  #MAIN
