parallel: True
par_backend: MPI
task: read
language: py
extension: h5
format: hdf5
required_packages:
    - openmpi
    - python
    - mpi4py
    - hdf5
    - h5py
create_command:
  serial: python {runnable}
  MPI: mpiexec -n python {runnable}
create: |
  from typing import TypedDict
  
  import h5py
  import numpy as np
  from mpi4py import MPI
  
  
  class Form(TypedDict):
      shape: list[int]
      chunks: list[int]
      dtype: tuple[str, list[str]]
  
  
  class bcolors:
      HEADER = "\033[95m"
      OKBLUE = "\033[94m"
      OKCYAN = "\033[96m"
      OKGREEN = "\033[92m"
      WARNING = "\033[93m"
      FAIL = "\033[91m"
      ENDC = "\033[0m"
      BOLD = "\033[1m"
      UNDERLINE = "\033[4m"
  
  
  def create(
      path: str,
      variables: list[str],
      shapes: list[list[int]],
      chunks: list[list[int]],
      datatypes: list[tuple[str, list[str]]],
      parallel: bool = False,
      collective: bool = False,
  ):
      form: dict[str, Form] = {}
      for index, var in enumerate(variables):
          form[var] = {
              "shape": shapes[index],
              "chunks": chunks[index],
              "dtype": datatypes[index],
          }
  
      root = h5py.File(path, "w-", driver="mpio", comm=MPI.COMM_WORLD)
      for variable, element in form.items():
          shape = element["shape"]
          chunk = element["chunks"]
          dtype = element["dtype"]
  
          if chunk:
              x: h5py.Dataset = root.create_dataset(
                  variable, shape=shape, chunks=tuple(chunk), dtype=dtype[0]
              )
          else:
              x: h5py.Dataset = root.create_dataset(variable, shape=shape, dtype=dtype[0])
  
          rank = MPI.COMM_WORLD.rank
          rsize = MPI.COMM_WORLD.size
  
          slices: list[slice] = []
          needed_shape: list[int] = []

          size = shape[0] // rsize
          rstart = rank * size
          rend = rstart + size
          slices.append(
                  slice(
                      rstart,
                      rend,
                  )
              )
          needed_shape.append(size)

          for total_size in shape[1:]:
              slices.append(
                  slice(
                      None,
                      None,
                  )
              )
              needed_shape.append(total_size)
  
          if collective:
              print(bcolors.OKBLUE + "Setting I/O to be collective" + bcolors.ENDC)
              x[*slices] = np.random.randn(*needed_shape).astype(dtype[0])
          else:
              print(bcolors.OKBLUE + "Setting I/O to be independent" + bcolors.ENDC)
              if rank == rank:
                  x[*slices] = np.random.randn(*needed_shape).astype(dtype[0])
          MPI.COMM_WORLD.Barrier()
  
      root.close()
      print(f"{bcolors.OKGREEN}FINISHED{bcolors.ENDC}")


  #MAIN
run_command:
  serial: python {runnable}
  MPI: mpiexec -n python {runnable}
source: |
  import math
  import os
  import time
  from itertools import chain
  from typing import Any
  
  import h5py
  import numpy as np
  from mpi4py import MPI
  
  
  class bcolors:
      HEADER = "\033[95m"
      OKBLUE = "\033[94m"
      OKCYAN = "\033[96m"
      OKGREEN = "\033[92m"
      WARNING = "\033[93m"
      FAIL = "\033[91m"
      ENDC = "\033[0m"
      BOLD = "\033[1m"
      UNDERLINE = "\033[4m"
  
  
  def bench_helper(
      iterations: int,
      variables: list[str],
      dataset: h5py.File,
      node: str,
      rank: int,
      rsize: int,
      collective: bool,
  ) -> list[tuple[str, ...]]:
      bench: list[tuple[str, ...]] = []
      for _ in range(iterations):
          times: list[float] = []
          total_read: int = 0
  
          for var in variables:
              start = time.monotonic()
  
              current: h5py.Dataset = dataset[var]

              slices: list[slice] = []
              shape: tuple[int, ...] = current.shape
              size = shape[0] // rsize
              rstart = rank * size
              rend = rstart + size
              slices.append(
                      slice(
                          rstart,
                          rend,
                      )
                  )

              for _ in shape[1:]:
                  slices.append(
                      slice(
                          None,
                          None,
                      )
                  )
  
              if collective:
                  print(
                      bcolors.OKBLUE + "Setting I/O to be collective" + bcolors.ENDC
                  )
                  #INSTRUMENTER_START
                  smth = current[*slices]
                  #INSTRUMENTER_STOP
                  total_read += math.prod(smth.shape)
              else:
                  print(
                      bcolors.OKBLUE + "Setting I/O to be independent" + bcolors.ENDC
                  )
                  if rank == rank:
                      #INSTRUMENTER_START
                      smth = current[*slices]
                      #INSTRUMENTER_STOP
                      total_read += math.prod(smth.shape)
  
              times.append(time.monotonic() - start)
  
          bench.append((str(rank), node, str(total_read), str(round(np.mean(times), 32))))
          MPI.COMM_WORLD.Barrier()
  
      dataset.close()
      MPI.COMM_WORLD.Barrier()
      print(f"{bcolors.OKGREEN}FINISHED{bcolors.ENDC}")
  
      return bench
  
  
  def bench(
      path: str,
      iterations: int,
      variables: list[str],
      xrun_params: dict[str, Any],
      parallel: bool = False,
      collective: bool = False,
  ) -> list[tuple[str, ...]] | None:
  
      dataset = h5py.File(path, mode="r", driver="mpio", comm=MPI.COMM_WORLD)
  
      var_tmp = []
      comm = MPI.COMM_WORLD
      rank = MPI.COMM_WORLD.rank
      rsize = MPI.COMM_WORLD.size
  
      var_sizes: list[tuple[int, ...]] = []
      for var in variables:
          try:
              var_ds: h5py.Dataset = dataset[var]
              var_size: tuple[int, ...] = var_ds.shape
              var_sizes.append(var_size)
              var_tmp.append(var)
          except KeyError:
              print(f"Variable: {var} does not exist.")
      print(
          f'for variable: {var_tmp} for engine: "hdf5", rank: {rank}, size: {var_sizes}'
      )
  
      node = "None"
      if "SLURMD_NODENAME" in os.environ:
          node = os.environ["SLURMD_NODENAME"]
  
      result: list[tuple[str, ...]] = bench_helper(
          iterations, var_tmp, dataset, node, rank, rsize, collective
      )
  
      gathered = comm.gather(result, root=0)
      if rank == 0 and gathered:
          return list(chain.from_iterable(gathered))
  

  #MAIN
