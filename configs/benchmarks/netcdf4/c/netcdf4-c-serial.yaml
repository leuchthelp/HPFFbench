parallel: False
task: "read"
language: c
extension: nc
format: netcdf4
compile: True
compile_command: gcc {runnable} <openmpi> -lmpi <hdf5> -lhdf5_hl -lhdf5 <netcdf-c> -lnetcdf
create_command:
  lazy: ["python {runnable}", "py", False]
create: |
  from func import datastruct as ds
  from dev_utils import bcolors as color
  import argparse

  def create_ds(form, parallel=False, path=None, collective=False):

      #new.create(path=path, shape=(512, 512, 512), chunks=(512, 512, 8), mode="r", engine="netcdf4")
      ds_netcdf4 = ds.Datastruct() 
      print(color.WARNING + f"Creating netcdf4" + color.ENDC)
      ds_netcdf4.create(path=path, form=form, engine="netcdf4", parallel=parallel, collective=collective)


  def create(variables=[], shapes=[], chunks=[], datatypes=[], parallel=False, path=None, collective=False):
      form = {}
      for index, var in enumerate(variables):
          form[var] = [shapes[index], chunks[index], datatypes[index]]

      create_ds(form=form, parallel=parallel, path=path, collective=collective)

  #MAIN
run_command:
  serial: "{runnable}"
source: |
  #include <stdio.h>
  #include <stdlib.h>
  #include <time.h>
  #include <hdf5.h>
  #include <netcdf.h>
  #include <unistd.h>
  #include <argp.h>

  #define ANSI_COLOR_RED "\x1b[31m"
  #define ANSI_COLOR_GREEN "\x1b[32m"
  #define ANSI_COLOR_YELLOW "\x1b[33m"
  #define ANSI_COLOR_BLUE "\x1b[34m"
  #define ANSI_COLOR_MAGENTA "\x1b[35m"
  #define ANSI_COLOR_CYAN "\x1b[36m"
  #define ANSI_COLOR_RESET "\x1b[0m"

  void bench(int argc, char **argv, hsize_t size, char** vars_to_bm, int iteration, char* location, double* result)
  {

      for (int i = 0; i < iteration; i++)
      {
          printf("i: %d for variable: X\n", i);
          int ncid, varid, retval;
          hsize_t some_size = size;
          float *rbuf = calloc(some_size, sizeof(float));

          if ((retval = nc_open(location, NC_NOWRITE, &ncid)))
          {
              printf("failure to open file");
              ERR(retval);
          }

          struct timespec start, end;

          clock_gettime(CLOCK_MONOTONIC, &start);

          if ((retval = nc_inq_varid(ncid, vars_to_bm[0], &varid)))
          {
              printf("failure finding variable id");
              ERR(retval);
          }

          if ((retval = nc_get_var_float(ncid, varid, rbuf)))
          {
              printf("failure reading variable");
              ERR(retval);
          }

          if ((retval = nc_close(ncid)))
              ERR(retval);

          clock_gettime(CLOCK_MONOTONIC, &end);
          double elapsed = end.tv_sec - start.tv_sec;
          elapsed += (end.tv_nsec - start.tv_nsec) / 1000000000.0;
          result[i] = elapsed;

          free(rbuf);
          printf(ANSI_COLOR_GREEN "Finished" ANSI_COLOR_RESET "\n");
      }
  }

  #MAIN
