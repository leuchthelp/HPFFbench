parallel: True
par_backend: MPI
task: read-random-ND-ranged
language: py
extension: nc
format: netcdf4
required_packages:
    - python
    - openmpi
    - mpi4py
    - hdf5
    - h5py
    - netcdf4
create_command:
  serial: python {runnable}
create: |
  from typing import TypedDict
  
  import netCDF4
  import numpy as np
  
  
  class Form(TypedDict):
      shape: list[int]
      chunk: list[int]
      dtype: tuple[str, list[str]]
  
  
  class bcolors:
      HEADER = "\033[95m"
      OKBLUE = "\033[94m"
      OKCYAN = "\033[96m"
      OKGREEN = "\033[92m"
      WARNING = "\033[93m"
      FAIL = "\033[91m"
      ENDC = "\033[0m"
      BOLD = "\033[1m"
      UNDERLINE = "\033[4m"
  
  
  def create(
      path: str,
      variables: list[str],
      shapes: list[list[int]],
      chunks: list[list[int]],
      datatypes: list[tuple[str, list[str]]],
      parallel: bool = False,
      collective: bool = False,
  ):
      form: dict[str, Form] = {}
      for index, var in enumerate(variables):
          form[var] = {
              "shape": shapes[index],
              "chunk": chunks[index],
              "dtype": datatypes[index],
          }
  
      root = netCDF4.Dataset(path, "w", format="NETCDF4", parallel=False)
      root.createGroup("/")
      used = 0
  
      for variable, element in form.items():
          shape = element["shape"]
          chunk = element["chunk"]
          dtype = element["dtype"]
  
          # setup individual dimensions & variables per main data variable
          dimensions = []
          for idx, dim_shape in enumerate(shape):
              varname = f"{used}"
  
              root.createDimension(varname, dim_shape)
              dimensions.append(varname)
              used += 1
  
              dim_dtype = dtype[1][idx]
              if chunk:
                  dim_chunks = chunk[idx]
                  x = root.createVariable(
                      varname, dim_dtype, (varname,), chunksizes=[dim_chunks]
                  )
              else:
                  x = root.createVariable(varname, dtype[0], (varname,))
              x[:] = np.random.randn(dim_shape).astype(dim_dtype)
  
          # setup main data variable
          data_dtype = dtype[0]
          if chunk:
              data_chunks = chunk
              x = root.createVariable(
                  variable, data_dtype, dimensions, chunksizes=data_chunks
              )
          else:
              x = root.createVariable(variable, data_dtype, dimensions)
          x[:] = np.random.randn(*shape).astype(data_dtype)
  
      root.close()
      print(f"{bcolors.OKGREEN}FINISHED{bcolors.ENDC}")


  #MAIN
run_command:
  serial: python {runnable}
  MPI: mpiexec -n python {runnable}
required_additional_params:
    - max_number_access
source: |
  import os
  import time
  from itertools import chain
  from typing import Any
  
  import netCDF4
  import numpy as np
  from mpi4py import MPI
  
  
  class bcolors:
      HEADER = "\033[95m"
      OKBLUE = "\033[94m"
      OKCYAN = "\033[96m"
      OKGREEN = "\033[92m"
      WARNING = "\033[93m"
      FAIL = "\033[91m"
      ENDC = "\033[0m"
      BOLD = "\033[1m"
      UNDERLINE = "\033[4m"
  
  
  def bench_helper(
      iterations: int,
      variables: list[str],
      xrun_params: dict[str, Any],
      dataset: netCDF4.Dataset,
      node: str,
      rank: int,
      rsize: int,
      collective: bool,
  ) -> list[tuple[str, ...]]:
      bench: list[tuple[str, ...]] = []
      for _ in range(iterations):
          times: list[float] = []
          total_read: int = 0
  
          for var in variables:
              number_access = xrun_params["max_number_access"] // rsize
              print(f"Got to do: {number_access} dataset accesses on rank: {rank}")
              
              start = time.monotonic()
  
              current: netCDF4.Variable = dataset[var]
              combinations = []
              for _ in range(number_access):
                  slices: list[slice] = []
                  for total_size in current.shape:
                      size = total_size // rsize
                      rstart = rank * size
                      rend = rstart + size
                      slices.append(
                          slice(rstart, rend, np.random.randint(low=1, high=size))
                      )
                  combinations.append(slices)
  
              if collective:
                  print(
                      bcolors.OKBLUE + "Setting I/O to be collective" + bcolors.ENDC
                  )
                  current.set_collective(True)
              else:
                  print(
                      bcolors.OKBLUE + "Setting I/O to be independent" + bcolors.ENDC
                  )
  
              #INSTRUMENTER_START
              for comb in combinations:
                  smth = current[*comb]
                  np.mean(smth)
                  total_read += sum(smth.shape)
              #INSTRUMENTER_STOP
              times.append(time.monotonic() - start)
  
          bench.append((str(rank), node, total_read, str(round(np.mean(times), 32))))
          MPI.COMM_WORLD.Barrier()
  
      dataset.close()
      MPI.COMM_WORLD.Barrier()
      print(f"{bcolors.OKGREEN}FINISHED{bcolors.ENDC}")
  
      return bench
    
  def bench(
      path: str,
      iterations: int,
      variables: list[str],
      xrun_params: dict[str, Any],
      parallel: bool = False,
      collective: bool = False,
  ) -> list[tuple[str, ...]] | None:
  
      dataset = netCDF4.Dataset(path, mode="r", format="NETCDF4", parallel=parallel)
  
      var_tmp = []
      comm = MPI.COMM_WORLD
      rank = MPI.COMM_WORLD.rank
      rsize = MPI.COMM_WORLD.size
  
      var_sizes: list[tuple[int, ...]] = []
      for var in variables:
          try:
              var_size: tuple[int, ...] = dataset[var].shape
              var_sizes.append(var_size)
              var_tmp.append(var)
          except KeyError:
              print(f"Variable: {var} does not exist.")
      print(
          f'for variable: {var_tmp} for engine: "netcdf4", rank: {rank}, size: {var_sizes}'
      )
  
      node = "None"
      if "SLURMD_NODENAME" in os.environ:
          node = os.environ["SLURMD_NODENAME"]
  
      result: list[tuple[str, ...]] = bench_helper(
          iterations, var_tmp, xrun_params, dataset, node, rank, rsize, collective
      )
  
      gathered = comm.gather(result, root=0)
      if rank == 0 and gathered:
          return list(chain.from_iterable(gathered))
  

  #MAIN
