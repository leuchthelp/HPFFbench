parallel: configurable
par_backend: MPI
language: py
extension: h5
format: hdf5
create_command:
  serial: python {runnable}
  MPI: mpiexec -n python {runnable}
  profile: py-spy record --rate 100 --format speedscope -o <profile_path>.json -- python {runnable}
  profile-MPI: mpiexec -n py-spy record --rate 100 --format speedscope -o <profile_path>.json -- python {runnable}
create: |
  from hpffbench.func.datastruct import Datastruct
  from hpffbench.func.datastruct import Form


  def create_ds(
    form: dict[str, Form], path: str, parallel: bool = False, collective: bool = False
  ):

    ds_hdf5 = Datastruct()
    ds_hdf5.create(
        path=path, form=form, engine="hdf5", parallel=parallel, collective=collective
    )


  def create(
    path: str,
    variables: list[str] = [],
    shapes: list[list[int]] = [],
    chunks: list[list[int]] = [],
    datatypes: list[str] = [],
    parallel: bool = False,
    collective: bool = False,
  ):
    form: dict[str, Form] = {}
    for index, var in enumerate(variables):
        form[var] = {
            "shape": shapes[index],
            "chunks": chunks[index],
            "dtype": datatypes[index],
        }

    create_ds(form=form, path=path, parallel=parallel, collective=collective)

  #MAIN
run_command:
  serial: python -m scorep --thread=pthread --instrumenter-type=cTrace {runnable}
  MPI: mpiexec -n python -m scorep --mpp=mpi --thread=pthread --instrumenter-type=cTrace {runnable}
  profile: py-spy record --rate 100 --gil --idle --native --threads --function --subprocesses --format speedscope -o <profile_path>.json -- python {runnable}
  profile-MPI: mpiexec -n py-spy record --rate 100 --idle --subprocesses --full-filenames -F -n --format speedscope -o <profile_path>.json -- python {runnable}
source: |
  from hpffbench.func.datastruct import Datastruct


  def bench(
    path: str,
    iterations: int,
    variables: str,
    parallel: bool = False,
    collective: bool = False,
  ) -> list[int | float]:

    ds_hdf5 = Datastruct()
    ds_hdf5.open(mode="r", engine="hdf5", path=path)

    if parallel:
        ds_hdf5.collective = collective
        ds_hdf5.read(
            "bench_complete_parallel", variables=variables, iterations=iterations
        )
    else:
        ds_hdf5.read("bench_complete", variables=variables, iterations=iterations)

    result = ds_hdf5.log

    return result

  #MAIN
