site_name: HPFFbench
repo_name: leuchthelp/HPFFbench
repo_url: https://github.com/leuchthelp/HPFFbench
site_description: A file format benchmark framework designed for High Performance Compute (HPC) clusters running slurm. 
site_author: leuchthelp
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://hpffbench.readthedocs.io/']
docs_dir: docs
use_directory_urls: true

nav:
  - index.md
  - quick-start.md
  - visualize.md
  - Design:
    - design/overview.md
    - design/benchmarks.md
    - design/handler.md
    - design/spackmanager.md
    - design/benchmarkmanager.md


watch:
  - components
  - docs


theme:
  language: en
  name: "material"
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.share


plugins:
  - mkdocstrings