    - hdf5
    - hdf5: subfiling
    - netcdf4
    - zarr
    language:
    - py
    - c
    packages:
      spack:
        scorep:
          version: '9.3'
        python:
          version: 3.14.5
          fresh: true
        openmpi:
          version: 5.0.10
          fresh: true
        hdf5:
          version: 1.14.6
          variant: ~cxx~fortran+hl~ipo~java~map+mpi+shared+subfiling~szip+threadsafe+tools
        argobots:
          version: main
          fresh: true
        netcdf-c:
          version: 4.10.0
          variant: build_system=cmake
        py-mpi4py:
          version: 4.1.1
        py-h5py:
          version: 3.16.0
        py-netcdf4:
          version: 1.7.2
      pip:
        zarr:
          version: 3.2.1
        scorep:
          version: 4.5.1
    compiler: gcc@15.3.0
    install: true
