tasks:
- read
formats:
- hdf5
languages:
- py
paths:
  path_to_benchmarks: configs/benchmarks
  path_to_profilers: configs/profilers
  path_to_tmp: tmp
  path_to_root: /home/leuchtpc/Documents/HPFFbench
  path_to_bm_results: results/general
  path_to_results: results
  path_res_profiling: results/profiling
iterations: 10
runs:
  run17:
    X:
    - - 1342177280
    - - 8388608
  run20:
    X:
    - - 1342177280
    - - 1048576
parallel: Both
collective: false
par_backend:
- MPI
ranks:
- 2
- 4
- 8
nodes:
- 1
variable_to_benchmark:
- X
only_data: true
no_caching: true
use_spack_env: true
max_processes: 1
slurm_options:
- '

  #SBATCH --partition=compute

  #SBATCH --account=ku0598

  #SBATCH --constraint="[cell02]"

  #SBATCH --mem=0

  #SBATCH --cpu-freq=High

  #SBATCH --distribution=block:cyclic

  #SBATCH --time=02:00:00

  #SBATCH --exclusive

  #SBATCH --output=log/log-%j/log.%j.txt

  #SBATCH --error=log/log-%j/log.%j.err

  '
spack_env:
  test-env-1:
    target:
    - hdf5
    - hdf5: subfiling
    - netcdf4
    - zarr
    language:
    - py
    - c
    packages:
      spack:
        scorep:
          version: '9.3'
        python:
          version: 3.14.5
          fresh: true
        openmpi:
          version: 5.0.10
          fresh: true
        hdf5:
          version: 1.14.6
          variant: ~cxx~fortran+hl~ipo~java~map+mpi+shared+subfiling~szip+threadsafe+tools
        argobots:
          version: main
          fresh: true
        netcdf-c:
          version: 4.10.0
          variant: build_system=cmake
        py-mpi4py:
          version: 4.1.1
        py-h5py:
          version: 3.16.0
        py-netcdf4:
          version: 1.7.2
      pip:
        zarr:
          version: 3.2.1
        scorep:
          version: 4.5.1
    compiler: gcc@15.3.0
    install: true
delete_envs: false
paths_create: true
profiler: false
profilers:
- scorep
profiler_mode: manual
